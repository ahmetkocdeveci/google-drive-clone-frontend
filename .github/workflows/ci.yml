name: Frontend checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm test:e2e:types
      - run: pnpm build
      - run: pnpm check:runtime
      - run: pnpm check:dependencies
      - run: pnpm build:pages
        env:
          CF_PAGES: '1'
      - run: docker build -t ortak-drive-frontend:ci .
  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: frontend
          persist-credentials: false
      - name: Check out the companion API with read-only access
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ahmetkocdeveci/google-drive-clone-backend
          ref: main
          path: backend
          ssh-key: ${{ secrets.E2E_BACKEND_SSH_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.25.0'
          package_json_file: frontend/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated MongoDB and Mailpit
        working-directory: backend
        run: |
          echo "Companion API revision: $(git rev-parse HEAD)"
          docker compose up -d
          for attempt in $(seq 1 45); do
            if docker exec ortak-drive-dev-mongo-1 mongosh --port 27018 --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Start a temporary test API
        working-directory: backend
        run: |
          node scripts/e2e-server.mjs --isolated-test-server >"$RUNNER_TEMP/drive-e2e-api.log" 2>&1 &
          echo "DRIVE_E2E_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4100/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/drive-e2e-api.log"
          exit 1
      - name: Run desktop, mobile and accessibility tests
        run: pnpm test:e2e
        env:
          E2E_TEST_ENVIRONMENT: '1'
      - name: Stop temporary services
        if: always()
        working-directory: backend
        run: |
          if [ -n "${DRIVE_E2E_PID:-}" ]; then kill -TERM "$DRIVE_E2E_PID" 2>/dev/null || true; fi
          docker compose down
      - name: Save browser report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/drive-e2e-api.log
          retention-days: 7
          if-no-files-found: ignore
